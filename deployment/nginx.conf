server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 include /etc/nginx/mantrilo-seo.conf;
 error_page 404 /404.html;
 location = /404.html { internal; add_header X-Robots-Tag noindex always; }
 location = /_sitemap { return 404; }
 location = /_sitemap.html { return 404; }
 location ~ \.conf$ { return 404; }
 location / {
   rewrite ^/(.+)/$ /$1 permanent;
   try_files $uri $uri.html $uri/ =404;
 }
 location /_expo/static/ {
   expires 1y;
   add_header Cache-Control "public, immutable";
 }
}
